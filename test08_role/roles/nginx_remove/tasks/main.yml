---
- name: 1. 서비스 중지 및 비활성화
  service:
    name: nginx
    state: stopped
    enabled: no
  ignore_errors: yes

- name: 2-1. Rocky 에서 nginx 삭제
  dnf:
    name: nginx
    state: absent
    autoremove: yes
  when: ansible_distribution == "Rocky"

- name: 2-2. Ubuntu 에서 nginx 삭제
  apt:
    name: nginx
    state: absent
    purge: yes
    autoremove: yes
  when: ansible_distribution == "Ubuntu"

- name: 3. Rocky 잔여 설정파일, 로그, index.html 삭제
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx
    - /var/log/nginx
    - "{{ rocky_web_root }}/index.html"
  when: ansible_distribution == "Rocky"

- name: 4. Ubuntu 잔여 설정파일, 로그, index.html 삭제
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx
    - /var/log/nginx
    - "{{ ubuntu_web_root }}/index.html"
  when: ansible_distribution == "Ubuntu"