
- name: ubuntu linux에 nginx 셋업
  hosts: ubuntu
  become: yes

  tasks:
    - name: nginx 설치
      apt:
        name: nginx
        state: present
    - name: 서비스 시작 
      service:
        name: nginx
        state: started
        enabled: yes
    - name: index.html 템플릿 배포
      template:
        src: index.html
        dest: /var/www/html/index.html
        mode: "0644"
    - name: 방화벽 해제 
      service:
        name: ufw
        state: stopped
        enabled: no